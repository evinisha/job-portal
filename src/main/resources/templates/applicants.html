<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Applicants</title>

    <link rel="stylesheet" href="/style.css?v=2">
</head>

<body>

<div class="dashboard">

    <h1>Job Applicants</h1>

    <button onclick="goBack()">
        ← Back to Dashboard
    </button>

    <div id="applicantsContainer"></div>

</div>


<script>

    async function loadApplicants() {

        const user = JSON.parse(
            localStorage.getItem("user")
        );

        if (!user) {
            window.location.href = "/login";
            return;
        }

        const params = new URLSearchParams(
            window.location.search
        );

        const jobId = params.get("jobId");

        if (!jobId) {
            document.getElementById("applicantsContainer").innerHTML =
                "<p>Job not selected.</p>";
            return;
        }

        try {

            const response = await fetch(
                "/api/applications/job/" +
                jobId +
                "?recruiterId=" +
                user.id
            );

            const result = await response.text();

            let applicants;

            try {
                applicants = JSON.parse(result);
            } catch {
                document.getElementById("applicantsContainer").innerHTML =
                    "<p>" + result + "</p>";
                return;
            }

            displayApplicants(applicants);

        } catch (error) {

            console.error(error);

            document.getElementById("applicantsContainer").innerHTML =
                "<p>Unable to load applicants.</p>";
        }
    }


    function displayApplicants(applicants) {

        const container =
            document.getElementById("applicantsContainer");

        container.innerHTML = "";

        if (applicants.length === 0) {

            container.innerHTML =
                "<p>No applicants for this job yet.</p>";

            return;
        }

        applicants.forEach(function(applicant) {

            const card = document.createElement("div");

            card.className = "job-card";

            card.innerHTML = `

            <h3>${applicant.name}</h3>

            <p>
                <strong>Email:</strong>
                ${applicant.email}
            </p>

            <p>
                <strong>Application ID:</strong>
                ${applicant.id}
            </p>

            <p>
    <strong>Status:</strong>
</p>

<select id="status-${applicant.id}"
        onchange="updateStatus(${applicant.id})">

    <option value="APPLIED"
        ${applicant.status === "APPLIED" ? "selected" : ""}>
        APPLIED
    </option>

    <option value="SHORTLISTED"
        ${applicant.status === "SHORTLISTED" ? "selected" : ""}>
        SHORTLISTED
    </option>

    <option value="REJECTED"
        ${applicant.status === "REJECTED" ? "selected" : ""}>
        REJECTED
    </option>

</select>

        `;

            container.appendChild(card);

        });
    }

    async function updateStatus(applicationId) {

        const status =
            document.getElementById(
                "status-" + applicationId
            ).value;

        const response = await fetch(
            "/api/applications/" +
            applicationId +
            "/status",
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        const result = await response.text();

        alert(result);

    }


    function goBack() {

        window.location.href =
            "/recruiter-dashboard";

    }


    loadApplicants();

</script>

</body>
</html>
